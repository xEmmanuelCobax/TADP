
{% extends 'base-tundra.html' %}

{% block title %}
- Login
{% endblock %}

{% block content %}

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="d-flex justify-content-center">
                    <div class="card">
                        <div class="card-header">
                            <h1 class="text-center">Inicio de sesión</h1>
                        </div>
    
                        <div class="card-body">
                            <form action="" method="post">
                                <div class="form-group position-relative">
                                    <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required minlength="4" maxlength="20">
                            
                                    <div class="error-msg">
                                
                                    </div>
                                   
                                </div>
                                <div class="form-group position-relative">
                                    <input type="password" class="form-control" id="password" name="password" required placeholder="Contraseña" minlength="6" maxlength="40">
                                    {% if error_message %}
                                    <div class="error-msg">
                                        {{ error_message }}
                                    </div>
                                    {% endif %}
                                </div>
                                <div class="text-center">
                                    <input type="submit" class="btn btn-primary" value="Iniciar sesión">
                                </div>
                            </form>
                            <div class="text-center mt-3">
                                ¿No tienes una cuenta? <a href="{{url_for('auth.register')}}" class="register-link">Regístrate aquí</a>.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>


{% endblock %}
