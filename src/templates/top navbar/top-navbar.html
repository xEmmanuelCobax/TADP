<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SaleTrackStar {% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">SaleTrackStar</a>
            <button class="navbar-toggler justify-content-end" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarText">
                <ul class="navbar-nav ms-auto mb-5 mb-lg-1">
                    <li class="nav-item me-4">
                        <a class="nav-link active" aria-current="page" href="#">Productos</a>
                    </li>
                    <!-- Aquí agregué la clase ms-auto -->
                    <!-- 
            En esta parte creo que modificarás tu codigo o no se si lo tienes ya configurado.
            Cuando se renderice el "index" en la ruta donde tienes dicho index, deberas renderizarla con un valor de tipo booleano
            llamado "logged_in", hace referencia a que si un usuario esta con una session activa no le salga que puede registrarse y por el contraio pueda ver detalles de su cuenta
            -->

                    <!-- Si no se cumple la funcuíón simplemente no va a cargar account y cargará a opción para entrar al login.#
            Eso es lo que hice con esta parte de flask.
            -->

                    <!-- Aunque ahora no veo necesario configurar esa parte -->
                    {% if logged_in %}
                    <li class="nav-item me-4">
                        <a class="nav-link active" aria-current="page" href="#">Account</a>
                    </li>
                    {% else %}
                    <!-- agregar ruta para acceder al login -->
                    <li class="nav-item me-4">
                        <a class="nav-link active" aria-current="page" href="#">Login</a>
                    </li>
                    {% endif %}
                    <!-- agregar ruta para acceder al register -->
                    <li class="nav-item me-4">
                        <a class="nav-link active" aria-current="page" href="#">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Quiero que tenga la función para buscar cosas de la tienda, pero creo que aun no le daremos uso -->
    <!-- por lo tanto, estará oculto -->
    {% if product %}
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </nav>
    {% endif %} {% block content %} {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
