<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %} {% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body.dark-mode {
      background-color: #333;
      color: #fff;
    }
  </style>
</head>
<body class="dark-mode-toggle">
  <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">SaleTrackStar</a>
      <button
        class="btn btn-primary ms-auto"
        onclick="toggleTheme()"
      >
        Cambiar Tema
      </button>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarText"
        aria-controls="navbarText"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarText">
        <ul class="navbar-nav ms-auto mb-5 mb-lg-1">
          {% if 'email' in session %}
          <li class="nav-item me-4">
            <a class="nav-link active" aria-current="page" href="holamundo:D">{{ email }}</a>
          </li>
          <li class="nav-item me-4">
            <a class="nav-link active" aria-current="page" href="{{ url_for('Signout') }}">Sign Out</a>
          </li>
          <li class="nav-item me-4">
            <a class="nav-link active" aria-current="page" href="{{ url_for('tasks') }}">Almacén</a>
          </li>
          {% endif %}
          {% if 'email' not in session %}
          <li class="nav-item me-4">
            <a class="nav-link active" aria-current="page" href="{{ url_for('signup') }}">Sign up</a>
          </li>
          <li class="nav-item me-4">
            <a class="nav-link active" aria-current="page" href="{{ url_for('sign') }}">Sign in</a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- Quiero que tenga la función para buscar cosas de la tienda, pero creo que aun no le daremos uso -->
  <!-- por lo tanto, estará oculto -->
  {% if product %}
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
      <form class="d-flex" role="search">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Search"
          aria-label="Search"
        />
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>
  {% endif %} {% block content %} {% endblock %}

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Recuperar el estado del tema del almacenamiento local
      const theme = localStorage.getItem("theme");
      const body = document.body;
      const navbar = document.querySelector(".navbar");
      if (theme === "dark") {
        navbar.setAttribute("data-bs-theme", "dark");
        body.classList.add("dark-mode");
      } else {
        navbar.setAttribute("data-bs-theme", "");
        body.classList.remove("dark-mode");
      }
    });

    function toggleTheme() {
      const navbar = document.querySelector(".navbar");
      const theme = navbar.getAttribute("data-bs-theme");
      const body = document.body;
      if (theme === "dark") {
        navbar.setAttribute("data-bs-theme", "");
        body.classList.remove("dark-mode");
        // Guardar el estado del tema en el almacenamiento local
        localStorage.setItem("theme", "");
      } else {
        navbar.setAttribute("data-bs-theme", "dark");
        body.classList.add("dark-mode");
        // Guardar el estado del tema en el almacenamiento local
        localStorage.setItem("theme", "dark");
      }
    }
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
